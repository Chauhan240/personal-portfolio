services:
  backend:
    build: ./backend
    restart: unless-stopped
    # Bind-mounted (not `env_file:`) on purpose: Compose interpolates `$`
    # inside env_file values, which corrupts bcrypt hashes (they're full of
    # `$`). Mounting the file lets the app's own dotenv loader read it
    # verbatim instead.
    volumes:
      - ./backend/.env:/app/.env:ro
      - backend_data:/app/data
    expose:
      - "8000"
    # Hardening: immutable root filesystem, no privilege escalation, no Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 200

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    # Caddy only needs to bind ports 80/443.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 200

volumes:
  backend_data:
  caddy_data:
  caddy_config:
